# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: bun x --bun oxlint {staged_files}
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,css,md,mjs,cjs,yml,yaml}'
      run: bun x --bun prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun x --bun commitlint --edit {1}

pre-push:
  commands:
    test:
      run: bun test
