name: CT

on:
  workflow_call:
    inputs:
      artifact_id:
        description: ID of the production build artifact from CI
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Unit and HTTP smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Download CI build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}
      - name: Restore production build
        run: tar -xzf "$RUNNER_TEMP/next-build.tar.gz"
      - name: Smoke test the production homepage
        run: bash scripts/smoke.sh
