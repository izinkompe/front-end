name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: |
          bun run next typegen
          bun run tsc --noEmit
      - name: Build production app
        run: bun run build
      - name: Archive production build
        run: tar --exclude='.next/cache' -czf "$RUNNER_TEMP/next-build.tar.gz" .next
      - name: Upload build for testing
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/next-build.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  test:
    name: CT
    needs: build
    uses: ./.github/workflows/ct.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}

  deploy:
    name: CD
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
